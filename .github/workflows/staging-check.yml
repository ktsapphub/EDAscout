# Quick health check of the staging sandbox (and production for comparison). Read-only.
name: "Staging · health check"
run-name: "staging health check"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: "Check pages and API"
        run: |
          for host in edascout-staging.ktsapps.com edascout.ktsapps.com; do
            for path in / /api/me "/api/dashboard?geo=norfolk"; do
              code=$(curl -s -o /tmp/body -w '%{http_code} %{time_total}s' "https://$host$path"); echo "$host$path -> $code"
              case "$code" in 2*) ;; *) echo "--- headers"; curl -sI "https://$host$path" | head -15; echo "--- body"; head -c 600 /tmp/body; echo;; esac
            done
          done
      - name: "Staging deployments"
        run: npx --yes wrangler@4 deployments list --env staging 2>&1 | tail -15 || true
