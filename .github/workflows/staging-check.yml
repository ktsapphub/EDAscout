# Quick health check of the staging sandbox (and production for comparison). Read-only.
name: "Staging · health check"
run-name: "staging health check"
on:
  workflow_dispatch:
    inputs:
      refresh: { description: "Also run a fresh scan on staging first", type: boolean, default: false }
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: "Refresh staging data (optional)"
        if: inputs.refresh
        run: curl -s -X POST https://edascout-staging.ktsapps.com/api/run | tail -c 400; echo
      - name: "Check pages and API"
        run: |
          for host in edascout-staging.ktsapps.com edascout.ktsapps.com; do
            for path in / /api/me "/api/dashboard?geo=norfolk"; do
              code=$(curl -s -o /tmp/body -w '%{http_code} %{time_total}s' "https://$host$path"); echo "$host$path -> $code"
              case "$code" in 2*) ;; *) echo "--- headers"; curl -sI "https://$host$path" | head -15; echo "--- body"; head -c 600 /tmp/body; echo;; esac
            done
          done
      - name: "What staging is serving"
        run: |
          echo "env:        $(curl -s https://edascout-staging.ktsapps.com/api/me | jq -c .)"
          for g in norfolk region state; do
            curl -s "https://edascout-staging.ktsapps.com/api/dashboard?geo=$g" | jq -r --arg g "$g" '"\($g): \(.signals|length) signals, \(.meetings|length) EDA docs, \(.latest|length) latest, outlook=\(.outlook!=null), synopsis=\(.overview!=null)"'
          done
          curl -s "https://edascout-staging.ktsapps.com/api/stats?range=30" | jq -c '{visitors, views}' | sed 's/^/usage (staging only): /'
          curl -s https://edascout-staging.ktsapps.com/ | grep -o 'app.js?v=[0-9]*' | head -1 | sed 's/^/front end: /'
          curl -s -o /tmp/tts.mp3 -w 'tts: %{http_code} %{content_type} %{size_download} bytes %{time_total}s\n' -X POST -H 'content-type: application/json' -d '{"text":"Here is your Norfolk economic development brief."}' https://edascout-staging.ktsapps.com/api/tts
      - name: "Staging deployments"
        run: npx --yes wrangler@4 deployments list --env staging 2>&1 | tail -15 || true
